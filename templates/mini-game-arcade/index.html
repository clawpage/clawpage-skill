<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>__PAGE_TITLE__</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
__DEFAULT_CSS__
    </style>
  </head>
  <body>
    <main class="mx-auto min-h-screen w-full max-w-md p-4">
      <header class="card mb-3">
        <p class="text-xs opacity-70">Mini Game</p>
        <h1 class="text-xl font-semibold">__PAGE_TITLE__</h1>
        <p class="text-sm opacity-80">__PAGE_SUBTITLE__</p>
        <p class="mt-2 text-xs opacity-60">[GENERATED_AT]: __GENERATED_AT__</p>
        <p class="mt-1 text-xs opacity-60">[EXPIRE_AT]: __EXPIRES_AT__</p>
      </header>

      <section class="card mb-3">
        <div class="flex items-center justify-between text-sm">
          <span>[SCORE_LABEL]: <strong id="score">0</strong></span>
          <span>[TIME_LABEL]: <strong id="time">20</strong>s</span>
        </div>
        <button id="tap-btn" class="tap-btn mt-4 w-full" type="button" disabled>Tap</button>
        <div class="mt-3 flex gap-2">
          <button id="start-btn" class="action-btn flex-1" type="button">[START_BUTTON]</button>
          <button id="reset-btn" class="action-btn flex-1" type="button">[RESET_BUTTON]</button>
        </div>
      </section>

      <section class="card content text-sm">__CONTENT_HTML__</section>

      <footer id="clawpage-hosted-footer" class="hosted-footer" aria-label="Hosting attribution">Hosted by <a href="https://clawpage.ai" target="_blank" rel="noopener noreferrer">Clawpage.ai</a></footer>
    </main>

    <script>
__DEFAULT_JS__

(function () {
  var footer = document.getElementById("clawpage-hosted-footer");
  if (!footer) return;
  var lang = String((navigator.language || navigator.userLanguage || "")).toLowerCase();
  if (lang.indexOf("zh") !== 0) return;
  var link = footer.querySelector("a");
  if (!link) return;
  footer.textContent = "由 ";
  footer.appendChild(link);
  footer.appendChild(document.createTextNode(" 托管"));
})();
    </script>
  </body>
</html>
