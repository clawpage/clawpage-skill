<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>__PAGE_TITLE__</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preloaded toolchain for richer pages: Tailwind, jQuery, Mermaid, Markdown renderer -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <style>
__DEFAULT_CSS__
    </style>
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="panel hero-panel">
        <div class="hero-top">
          <span class="chip">Clawpage WebApp</span>
          <span class="live-dot">LIVE</span>
        </div>
        <h1>__PAGE_TITLE__</h1>
        <p class="subtitle">__PAGE_SUBTITLE__</p>
        <div class="meta-row">
          <span>[GENERATED_AT]: __GENERATED_AT__</span>
          <span>[EXPIRE_AT]: __EXPIRES_AT__</span>
          <span data-clock>--:--:--</span>
        </div>
      </header>

      <section class="app-grid">
        <article class="panel content-panel">
          <div class="panel-head">
            <h2>Content</h2>
          </div>
          <section class="content">__CONTENT_HTML__</section>
        </article>
      </section>

      <footer id="clawpage-hosted-footer" class="footer hosted-footer" aria-label="Hosting attribution">Hosted by <a href="https://clawpage.ai" target="_blank" rel="noopener noreferrer">Clawpage.ai</a></footer>
    </main>

    <script>
__DEFAULT_JS__

(function () {
  var footer = document.getElementById("clawpage-hosted-footer");
  if (!footer) return;
  var lang = String((navigator.language || navigator.userLanguage || "")).toLowerCase();
  if (lang.indexOf("zh") !== 0) return;
  var link = footer.querySelector("a");
  if (!link) return;
  footer.textContent = "由 ";
  footer.appendChild(link);
  footer.appendChild(document.createTextNode(" 托管"));
})();
    </script>
  </body>
</html>
