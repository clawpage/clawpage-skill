<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>__PAGE_TITLE__</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <style>
__DEFAULT_CSS__
    </style>
  </head>
  <body>
    <main class="mx-auto min-h-screen w-full max-w-lg p-4">
      <header class="panel mb-3">
        <p class="label">Concept Animation</p>
        <h1 class="text-xl font-semibold">__PAGE_TITLE__</h1>
        <p class="text-sm opacity-80">__PAGE_SUBTITLE__</p>
        <p class="mt-1 text-xs opacity-70">[GENERATED_AT]: __GENERATED_AT__</p>
        <p class="mt-1 text-xs opacity-70">[EXPIRE_AT]: __EXPIRES_AT__</p>
      </header>

      <section class="panel mb-3">
        <p id="step-title" class="text-base font-semibold"></p>
        <p id="step-desc" class="mt-1 text-sm opacity-80"></p>
        <div class="stage mt-3" id="stage">
          <div class="node" id="node-a">A</div>
          <div class="node" id="node-b">B</div>
          <div class="node" id="node-c">C</div>
        </div>
        <div class="mt-3 flex gap-2">
          <button id="prev-btn" class="btn-secondary flex-1" type="button">[PREVIOUS]</button>
          <button id="next-btn" class="btn flex-1" type="button">[NEXT]</button>
        </div>
      </section>

      <section class="panel text-sm">__CONTENT_HTML__</section>

      <footer id="clawpage-hosted-footer" class="hosted-footer" aria-label="Hosting attribution">Hosted by <a href="https://clawpage.ai" target="_blank" rel="noopener noreferrer">Clawpage.ai</a></footer>
    </main>

    <script>
__DEFAULT_JS__

(function () {
  var footer = document.getElementById("clawpage-hosted-footer");
  if (!footer) return;
  var lang = String((navigator.language || navigator.userLanguage || "")).toLowerCase();
  if (lang.indexOf("zh") !== 0) return;
  var link = footer.querySelector("a");
  if (!link) return;
  footer.textContent = "由 ";
  footer.appendChild(link);
  footer.appendChild(document.createTextNode(" 托管"));
})();
    </script>
  </body>
</html>
