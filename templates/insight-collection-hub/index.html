<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>__PAGE_TITLE__</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
__DEFAULT_CSS__
    </style>
  </head>
  <body>
    <main class="mx-auto min-h-screen w-full max-w-xl p-4">
      <header class="panel mb-3">
        <p class="label">Insight Hub</p>
        <h1 class="text-xl font-semibold">__PAGE_TITLE__</h1>
        <p class="text-sm text-slate-600">__PAGE_SUBTITLE__</p>
        <p class="mt-1 text-xs text-slate-500">[GENERATED_AT]: __GENERATED_AT__</p>
        <p class="mt-1 text-xs text-slate-500">[EXPIRE_AT]: __EXPIRES_AT__</p>
      </header>

      <section class="panel mb-3">
        <input id="search-input" class="field mb-2" type="search" placeholder="[SEARCH_PLACEHOLDER]" />
        <div class="flex flex-wrap gap-2">
          <button class="chip active" data-tag="all" type="button">[FILTER_ALL]</button>
          <button class="chip" data-tag="product" type="button">[FILTER_PRODUCT]</button>
          <button class="chip" data-tag="growth" type="button">[FILTER_GROWTH]</button>
          <button class="chip" data-tag="ops" type="button">[FILTER_OPS]</button>
        </div>
      </section>

      <section id="card-list" class="grid gap-2"></section>

      <section class="panel mt-3 text-sm">__CONTENT_HTML__</section>

      <footer id="clawpage-hosted-footer" class="hosted-footer" aria-label="Hosting attribution">Hosted by <a href="https://clawpage.ai" target="_blank" rel="noopener noreferrer">Clawpage.ai</a></footer>
    </main>

    <script>
__DEFAULT_JS__

(function () {
  var footer = document.getElementById("clawpage-hosted-footer");
  if (!footer) return;
  var lang = String((navigator.language || navigator.userLanguage || "")).toLowerCase();
  if (lang.indexOf("zh") !== 0) return;
  var link = footer.querySelector("a");
  if (!link) return;
  footer.textContent = "由 ";
  footer.appendChild(link);
  footer.appendChild(document.createTextNode(" 托管"));
})();
    </script>
  </body>
</html>
