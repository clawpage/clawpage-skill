<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>__PAGE_TITLE__</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
__DEFAULT_CSS__
    </style>
  </head>
  <body>
    <main class="mx-auto min-h-screen w-full max-w-lg p-4">
      <header class="panel mb-3">
        <p class="label">Utility Tool</p>
        <h1 class="text-xl font-semibold">__PAGE_TITLE__</h1>
        <p class="text-sm text-slate-600">__PAGE_SUBTITLE__</p>
        <p class="mt-1 text-xs text-slate-500">[GENERATED_AT]: __GENERATED_AT__</p>
        <p class="mt-1 text-xs text-slate-500">[EXPIRE_AT]: __EXPIRES_AT__</p>
      </header>

      <section class="panel mb-3">
        <label class="label" for="input-text">[INPUT_LABEL]</label>
        <textarea id="input-text" rows="5" placeholder="Paste text..." class="field"></textarea>

        <label class="label mt-3" for="mode">[MODE_LABEL]</label>
        <select id="mode" class="field">
          <option value="trim">[MODE_TRIM]</option>
          <option value="upper">[MODE_UPPER]</option>
          <option value="lower">[MODE_LOWER]</option>
          <option value="count">[MODE_COUNT]</option>
        </select>

        <div class="mt-3 flex gap-2">
          <button id="run-btn" class="btn flex-1" type="button">[RUN_BUTTON]</button>
          <button id="copy-btn" class="btn-secondary flex-1" type="button">[COPY_BUTTON]</button>
        </div>
      </section>

      <section class="panel mb-3">
        <p class="label">[OUTPUT_LABEL]</p>
        <pre id="output" class="output"></pre>
      </section>

      <section class="panel text-sm">__CONTENT_HTML__</section>
    </main>

    <script>
__DEFAULT_JS__
    </script>
  </body>
</html>
