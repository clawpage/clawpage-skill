<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>__PAGE_TITLE__</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
__DEFAULT_CSS__
    </style>
  </head>
  <body>
    <main class="mx-auto min-h-screen w-full max-w-xl p-4">
      <header class="panel mb-3">
        <p class="label">Stock Insight</p>
        <h1 class="text-xl font-semibold">__PAGE_TITLE__</h1>
        <p class="text-sm opacity-80">__PAGE_SUBTITLE__</p>
        <p class="mt-1 text-xs opacity-70">[GENERATED_AT]: __GENERATED_AT__</p>
        <p class="mt-1 text-xs opacity-70">[EXPIRE_AT]: __EXPIRES_AT__</p>
      </header>

      <section class="panel mb-3">
        <div class="mb-2 flex gap-2" role="group" aria-label="Range">
          <button class="chip active" data-range="7" type="button">7D</button>
          <button class="chip" data-range="30" type="button">30D</button>
          <button class="chip" data-range="90" type="button">90D</button>
        </div>
        <div class="kpi-row text-sm">
          <span>[PRICE_LABEL]: <strong id="price-value">--</strong></span>
          <span>[CHANGE_LABEL]: <strong id="change-value">--</strong></span>
        </div>
        <div id="chart" class="chart mt-2"></div>
      </section>

      <section class="panel text-sm">__CONTENT_HTML__</section>

      <footer id="clawpage-hosted-footer" class="hosted-footer" aria-label="Hosting attribution">Hosted by <a href="https://clawpage.ai" target="_blank" rel="noopener noreferrer">Clawpage.ai</a></footer>
    </main>

    <script>
__DEFAULT_JS__

(function () {
  var footer = document.getElementById("clawpage-hosted-footer");
  if (!footer) return;
  var lang = String((navigator.language || navigator.userLanguage || "")).toLowerCase();
  if (lang.indexOf("zh") !== 0) return;
  var link = footer.querySelector("a");
  if (!link) return;
  footer.textContent = "由 ";
  footer.appendChild(link);
  footer.appendChild(document.createTextNode(" 托管"));
})();
    </script>
  </body>
</html>
